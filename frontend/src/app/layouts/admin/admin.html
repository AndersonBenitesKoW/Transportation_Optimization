<div class="admin-layout">
  <aside class="admin-sidebar"
         [class.admin-sidebar--collapsed]="sidebarColapsado">
    <div class="admin-sidebar-header">
      <div class="admin-sidebar-logo">FM</div>
      <div class="admin-sidebar-brand" [class.admin-sidebar-brand--hidden]="sidebarColapsado">
        <h2 class="admin-sidebar-title">FleetMind AI</h2>
        <p class="admin-sidebar-subtitle">Panel Admin</p>
      </div>
    </div>

    <button (click)="toggleSidebar()" class="admin-sidebar-toggle">
      <lucide-icon [img]="sidebarColapsado ? chevronRight : chevronLeft" class="w-3 h-3"></lucide-icon>
    </button>

    <nav class="admin-sidebar-nav">
      <a routerLink="/admin/dashboard"
         routerLinkActive="admin-sidebar-link--active"
         class="admin-sidebar-link">
        <lucide-icon [img]="layoutDashboard" class="w-5 h-5"></lucide-icon>
        <span [class.admin-sidebar-label--hidden]="sidebarColapsado" class="admin-sidebar-label">Dashboard</span>
      </a>
      <a routerLink="/admin/unidades"
         routerLinkActive="admin-sidebar-link--active"
         class="admin-sidebar-link">
        <lucide-icon [img]="truck" class="w-5 h-5"></lucide-icon>
        <span [class.admin-sidebar-label--hidden]="sidebarColapsado" class="admin-sidebar-label">Unidades</span>
      </a>
      <a routerLink="/admin/conductores"
         routerLinkActive="admin-sidebar-link--active"
         class="admin-sidebar-link">
        <lucide-icon [img]="users" class="w-5 h-5"></lucide-icon>
        <span [class.admin-sidebar-label--hidden]="sidebarColapsado" class="admin-sidebar-label">Conductores</span>
      </a>
      <a routerLink="/admin/alertas"
         routerLinkActive="admin-sidebar-link--active"
         class="admin-sidebar-link">
        <lucide-icon [img]="bell" class="w-5 h-5"></lucide-icon>
        <span [class.admin-sidebar-label--hidden]="sidebarColapsado" class="admin-sidebar-label">Alertas</span>
      </a>
    </nav>

    <div class="admin-sidebar-footer">
      <button (click)="toggleTema()" class="admin-sidebar-link">
        <lucide-icon [img]="themeService.isDark() ? sun : moon" class="w-5 h-5"></lucide-icon>
        <span [class.admin-sidebar-label--hidden]="sidebarColapsado" class="admin-sidebar-label">Tema</span>
      </button>
      <div class="admin-sidebar-profile">
        <div class="admin-sidebar-avatar">{{ iniciales }}</div>
        <div [class.admin-sidebar-label--hidden]="sidebarColapsado" class="admin-sidebar-label">
          <p class="admin-sidebar-username">{{ usuarioActual?.nombre || 'Admin' }}</p>
          <p class="admin-sidebar-rol">Administrador</p>
        </div>
      </div>
      <button (click)="cerrarSesion()" class="admin-sidebar-link admin-sidebar-link--danger">
        <lucide-icon [img]="logOut" class="w-5 h-5"></lucide-icon>
        <span [class.admin-sidebar-label--hidden]="sidebarColapsado" class="admin-sidebar-label">Cerrar Sesion</span>
      </button>
    </div>
  </aside>

  <main class="admin-main"
        [class.admin-main--expanded]="!sidebarColapsado"
        [class.admin-main--collapsed]="sidebarColapsado">
    <router-outlet></router-outlet>
  </main>
</div>
