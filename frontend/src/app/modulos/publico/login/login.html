<div class="login-page">
  <div class="login-orb login-orb--1"></div>
  <div class="login-orb login-orb--2"></div>

  <button (click)="toggleTema()" class="login-theme-btn">
    <lucide-icon [img]="themeService.isDark() ? sun : moon" class="w-5 h-5"></lucide-icon>
  </button>

  <div class="login-card">
    <div class="login-card-brand">
      <div class="login-logo">
        <lucide-icon [img]="truck" class="w-8 h-8"></lucide-icon>
      </div>
      <h1 class="login-title">FleetMind AI</h1>
      <p class="login-subtitle">Portal de Acceso Logistico</p>
    </div>

    <div class="login-card-form">
      <input type="text" [(ngModel)]="credenciales.email" placeholder="Usuario o Email" [disabled]="cargando"
             class="login-input" />

      <div class="login-password-wrapper">
        <input [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="credenciales.password"
               placeholder="Contrasena" [disabled]="cargando" (keyup.enter)="iniciarSesion()"
               class="login-input login-input--password" />
        <button type="button" (click)="togglePassword()" class="login-password-toggle">
          <lucide-icon [img]="mostrarPassword ? eyeOff : eye" class="w-4 h-4"></lucide-icon>
        </button>
      </div>

      <button (click)="iniciarSesion()" [disabled]="cargando" class="login-submit">
        <span *ngIf="!cargando">Ingresar al Sistema</span>
        <span *ngIf="cargando" class="login-loading">
          <span class="login-spinner"></span>
          Ingresando...
        </span>
      </button>

      <p *ngIf="errorLogin" class="login-error">{{ errorLogin }}</p>

      <div class="login-divider">
        <span class="login-divider-text">Acceso rapido de prueba</span>
      </div>

      <div class="login-quick-btns">
        <button (click)="loginRapido('ADMIN')" class="login-quick-btn login-quick-btn--admin">
          Admin
        </button>
        <button (click)="loginRapido('CONDUCTOR')" class="login-quick-btn login-quick-btn--conductor">
          Conductor
        </button>
      </div>
      <p class="login-quick-hint">O usa: admin / admin123</p>
    </div>

    <div class="login-card-footer">
      <p class="login-footer-text">
        No tienes cuenta?
        <a routerLink="/register" class="login-footer-link">Registrate aqui</a>
      </p>
    </div>
  </div>
</div>
