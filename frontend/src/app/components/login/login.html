<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #2c3e50; font-family: 'Segoe UI', sans-serif;">
  <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 320px; text-align: center;">
      <div style="font-size: 50px; margin-bottom: 10px;">🚛</div>
      <h2 style="color: #2980b9; margin-bottom: 5px; font-weight: 800;">FleetMind AI</h2>
      <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 25px;">Portal de Acceso Logístico</p>
      
      <input type="text" [(ngModel)]="credenciales.user" placeholder="Usuario (ej. admin o c001)" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box;">
      <input type="password" [(ngModel)]="credenciales.pass" placeholder="Contraseña (admin123 o 1234)" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box;">
      
      <button (click)="iniciarSesion()" style="width: 100%; padding: 12px; background-color: #2980b9; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.3s;">
        Ingresar al Sistema
      </button>
      
      <p *ngIf="errorLogin" style="color: #e74c3c; font-size: 13px; margin-top: 15px; font-weight: bold;">⚠️ {{errorLogin}}</p>
  </div>
</div>
