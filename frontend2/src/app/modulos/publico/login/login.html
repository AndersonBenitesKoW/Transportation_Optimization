<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #2c3e50; font-family: 'Segoe UI', sans-serif;">
  <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 360px; text-align: center;">
      <div style="font-size: 50px; margin-bottom: 10px;">🚛</div>
      <h2 style="color: #2980b9; margin-bottom: 5px; font-weight: 800;">FleetMind AI</h2>
      <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 25px;">Portal de Acceso Logístico</p>
      
      <input 
        type="text" 
        [(ngModel)]="credenciales.email" 
        placeholder="Usuario o Email" 
        style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box;"
        [disabled]="cargando">
      
      <input 
        type="password" 
        [(ngModel)]="credenciales.password" 
        placeholder="Contraseña" 
        style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box;"
        [disabled]="cargando"
        (keyup.enter)="iniciarSesion()">
      
      <button 
        (click)="iniciarSesion()" 
        [disabled]="cargando"
        style="width: 100%; padding: 12px; background-color: #2980b9; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.3s;">
        {{ cargando ? 'Ingresando...' : 'Ingresar al Sistema' }}
      </button>
      
      <p *ngIf="errorLogin" style="color: #e74c3c; font-size: 13px; margin-top: 15px; font-weight: bold;">⚠️ {{errorLogin}}</p>
      
      <!-- Botones de acceso rápido para pruebas -->
      <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #ecf0f1;">
        <p style="color: #95a5a6; font-size: 12px; margin-bottom: 10px;">Acceso rápido de prueba:</p>
        <div style="display: flex; gap: 10px;">
          <button 
            (click)="loginRapido('ADMIN')" 
            style="flex: 1; padding: 8px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
            👨‍💼 Admin
          </button>
          <button 
            (click)="loginRapido('CONDUCTOR')" 
            style="flex: 1; padding: 8px; background-color: #f39c12; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
            🚚 Conductor
          </button>
        </div>
        <p style="color: #95a5a6; font-size: 11px; margin-top: 8px;">O usa: admin/admin123</p>
      </div>
  </div>
</div>
